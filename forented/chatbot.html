<!DOCTYPE html>
<html>
  <head>
    <title>chatbot</title>
  </head>
  <body>
    <div class="js-container"></div><br>

    <script src="react-basic.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ chatMessages, setChatMessages}) {
        const [inputText, setInputText] = React.useState('');

        function saveInputText(event) {
          setInputText(event.target.value)
        }

        async function sendMessage() {
          const newMessages = [
            ...chatMessages,
            {
              messeg: inputText, 
              sender: "user",
              id: crypto.randomUUID()
            }
          ]
          setInputText('')

          setChatMessages(newMessages);

          const response = await Chatbot.getResponseAsync(inputText);
          console.log(response)
          setChatMessages([
            ...newMessages,
            {
              messeg: response, 
              sender: "robot",
              id: crypto.randomUUID()
            }
          ]);


        }

        function enterFitur(params) {
          if (params.key === 'Enter') {
            sendMessage();
          } 
          if (params.key === 'Escape') {
            setInputText('');
          }
        }

        return (
          <>
            <input onKeyDown={enterFitur} type="text" name="" id="" placeholder="lasdf" size='9' onChange={saveInputText} value={inputText} />
            <button onClick={sendMessage} >send</button>
          </>
        );
      }

      function ChatMessage({messeg, sender}) {
        // console.log(props);
        // const messeg = props.messege
        // const sender = props.sender
        // const {messeg, sender} = props;
        /*
        if (sender === 'user') {
          return (
            <div>
            <img src="https://supersimple.dev/projects/chatbot/user.png" width="50" />
            {messeg}
            </div>
          );
        }

        */
        return (
          <div>
          {sender === 'robot' && (
            <img src="https://supersimple.dev/projects/chatbot/robot.png" width="50" />
            ) }
          {messeg}
          {sender === 'user' && (
            <img src="https://supersimple.dev/projects/chatbot/user.png" width="50" />
            ) }
          </div>
        );
      }

      function ChatMessages({chatMessages, setChatMessages}) {

        // const [chatMessages, setChatMessages] = array;
        // const chatMesseges = array[0]; // data
        // const setChatMessages = array[1]; // function to update data

            
    
        const chat = chatMessages.map((chatssd)=> {
          return (
            <ChatMessage 
              messeg={chatssd.messeg} 
              sender={chatssd.sender} 
              key={chatssd.id}
            />
          );
        });

        return (
          <>
            {chat}
          </>
        );

      }



      function App() {
        const [chatMessages, setChatMessages] = React.useState(
          [{
              messeg: "hello bro", 
              sender: "user",
              id: 1
            },{
              messeg: "how are you?", 
              sender: "robot",
              id: 2
            },{
              messeg: "i am fine, thank you!", 
              sender: "user",
              id: 3
            }]
        );

        return (
          <>
          <ChatInput 
            chatMessages = {chatMessages}
            setChatMessages = {setChatMessages}
            />
          <ChatMessages 
            chatMessages = {chatMessages}
            setChatMessages = {setChatMessages}
            />
        </>
        );
      }
      

      function MengimputText(params) {
        const Exlample = 'alice'
        const [inputText, setInputText] = React.useState('');
        function saveInputText(event) {
          setInputText(event.target.value)
        }

        function resetInputText() {
          setInputText('');
        }

        function example(params) {
          setInputText(Exlample);
        }

        return (
          <>
          <input type="text" onChange={saveInputText} value={inputText} placeholder='type your name' />
          <button onClick={resetInputText} >Reset</button>
          <button onClick={example} >Exlample</button>
          <p>Hello {inputText}</p>
          </>
        );
      }
      

      function App2(props) {
        return (
          <>
            <MengimputText />
          </>
        );
      }



      

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
</script>
  </body>
</html>
